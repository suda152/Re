distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 官方地址 services.gradle.org 会 302 到 GitHub Release，国内直连常被掐断，
# 这里换成腾讯云镜像（内容与官方一致）。海外机器可改回：
# https\://services.gradle.org/distributions/gradle-8.2.1-all.zip
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.2.1-all.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
